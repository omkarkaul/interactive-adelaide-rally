<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Mockup — day view</title>
<style>
:root{
--bg-base:#12141a;--bg-panel:#1b1e26;--bg-elevated:#242832;
--border:#2f3440;--border-strong:#454b5a;
--text-primary:#eef0f4;--text-secondary:#a2a9b8;--text-muted:#6f7787;
--state-pending:#7d8798;--state-closed:#e5484d;--state-closed-text:#ff8b8e;--state-reopened:#3f4654;
--accent:#f2733d;--radius:8px;
--mono:ui-monospace,SFMono-Regular,Menlo,monospace;
--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-base);color:var(--text-primary);font-family:var(--sans);font-size:13px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{height:56px;flex:none;display:flex;align-items:center;gap:16px;padding:0 16px;background:var(--bg-panel);border-bottom:1px solid var(--border)}
h1{font-size:18px;font-weight:500;margin:0}
.sub{font-size:12px;color:var(--text-muted)}
.tabs{margin-left:auto;display:flex;gap:6px}
.tab{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:transparent;color:var(--text-secondary);font:inherit;cursor:pointer;text-align:left}
.tab .d{font-size:11px;color:var(--text-muted);display:block}
.tab[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#1a0d06}
.tab[aria-selected=true] .d{color:#5c2f14}
main{flex:1;display:flex;min-height:0}
#panel{width:380px;flex:none;background:var(--bg-panel);border-right:1px solid var(--border);overflow-y:auto;padding:8px}
.card{padding:10px 12px;border-radius:var(--radius);border:1px solid transparent;border-left:3px solid var(--state-pending);margin-bottom:6px;cursor:pointer;background:transparent}
.card .code{font-family:var(--mono);font-size:12px;color:var(--text-secondary)}
.card .nm{font-size:15px;font-weight:500;margin-left:6px}
.card .w{font-family:var(--mono);font-size:13px;color:var(--text-secondary);margin-top:3px}
.card .rd{font-size:12px;color:var(--text-muted);margin-top:2px}
.card.closed{border-left-color:var(--state-closed)}
.card.closed .w{color:var(--state-closed-text)}
.card.reopened{border-left-color:var(--state-reopened);opacity:.6}
.card.focused{background:var(--bg-elevated);border-color:var(--border-strong)}
.card.dimmed{opacity:.4}
#mapwrap{flex:1;position:relative;background:#171b22;min-width:0}
svg{display:block;width:100%;height:100%}
footer{flex:none;background:var(--bg-panel);border-top:1px solid var(--border);padding:10px 16px 14px}
.srow{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.slabel{font-size:12px;color:var(--text-muted);text-transform:lowercase}
input[type=range]{flex:1;accent-color:var(--accent);height:4px}
.time{font-family:var(--mono);font-size:15px;font-weight:500;min-width:52px;text-align:right}
.gantt{position:relative}
.grow{display:flex;align-items:center;gap:8px;height:16px;margin-bottom:3px;cursor:pointer}
.glab{width:62px;flex:none;font-family:var(--mono);font-size:11px;color:var(--text-muted);text-align:right}
.gtrack{position:relative;flex:1;height:12px}
.gbar{position:absolute;top:0;bottom:0;border-radius:3px}
.gbar.pending{background:transparent;border:1px solid var(--state-pending)}
.gbar.closed{background:var(--state-closed)}
.gbar.reopened{background:var(--state-reopened)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--accent)}
.legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text-secondary)}
.sw{display:inline-block;width:16px;height:3px;vertical-align:3px;margin-right:6px;border-radius:2px}
</style>
</head>
<body>

<header>
  <div><h1>2026 Shannons Adelaide Rally</h1><div class="sub">Stages and road closures</div></div>
  <div class="tabs">
    <button class="tab" aria-selected="true">Day 1<span class="d">Fri, 16 Oct</span></button>
    <button class="tab" aria-selected="false">Day 2<span class="d">Sat, 17 Oct</span></button>
    <button class="tab" aria-selected="false">Day 3<span class="d">Sun, 18 Oct</span></button>
  </div>
</header>

<main>
  <div id="panel"></div>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid slice">
      <g stroke="#22272f" stroke-width="1" fill="none">
        <path d="M0 400 C160 388 300 412 470 398 C640 384 760 404 900 396"/>
        <path d="M0 250 C170 238 290 262 460 248 C630 234 770 254 900 246"/>
        <path d="M210 0 L198 160 L214 330 L200 520"/>
        <path d="M560 0 L548 150 L564 340 L552 520"/>
      </g>
      <g id="routes" fill="none" stroke-linecap="round"></g>
      <g id="labels"></g>
    </svg>
  </div>
</main>

<footer>
  <div class="srow">
    <span class="slabel">time of day</span>
    <input type="range" id="t" min="420" max="1200" step="5" value="580"/>
    <span class="time" id="tout">09:40</span>
  </div>
  <div class="gantt" id="gantt"></div>
  <div class="legend">
    <span><i class="sw" style="background:var(--state-pending)"></i>not yet closed</span>
    <span><i class="sw" style="background:var(--state-closed)"></i>closed now</span>
    <span><i class="sw" style="background:var(--state-reopened)"></i>reopened</span>
    <span style="color:var(--text-muted)">focus is opacity and weight, never colour</span>
  </div>
</footer>

<script>
const D=[
{id:'SS1',lab:'SS1',nm:'Beaumont',o:465,e:765,rd:'Hayward Dve',d:'M70 330 C120 316 150 292 205 288'},
{id:'SS2',lab:'SS2',nm:'Carey Gully',o:475,e:775,rd:'Greenhill Rd',d:'M215 296 C300 282 350 320 470 300 C560 286 620 306 720 288'},
{id:'SS3',lab:'SS3',nm:'Knotts Hill',o:520,e:1110,rd:'Hunters Rd · Knotts Hill Rd · Pound Rd',d:'M430 216 C500 190 512 148 590 128 C650 112 690 68 760 52'},
{id:'SS9',lab:'SS9',nm:'Knotts Hill Short',o:520,e:1110,rd:'Hunters Rd · Knotts Hill Rd',d:'M446 208 C512 184 524 150 588 132'},
{id:'SS4',lab:'SS4 / SS7',nm:'Cherryville Plus 1',o:550,e:1030,rd:'Marble Hill Rd · Montacute Rd · Corkscrew Rd · Gorge Rd',d:'M330 150 C400 128 424 78 500 62 C560 48 610 22 690 14'},
{id:'SS5',lab:'SS5',nm:'Vista 1',o:570,e:900,rd:'Lower North East Rd',d:'M120 120 C180 96 210 52 290 36'},
{id:'SS6',lab:'SS6 / SS10',nm:'Old Norton Summit 1',o:670,e:1115,rd:'Old Norton Summit Rd',d:'M160 248 C220 226 240 186 306 168'},
{id:'SS8',lab:'SS8',nm:'Stafford Hillclimb',o:685,e:1060,rd:'Fox Creek Rd · Staffords Rd',d:'M600 358 C660 336 668 300 730 286'},
{id:'SS11',lab:'SS11',nm:'Summit Road',o:820,e:1150,rd:'Mt Lofty Summit Rd',d:'M280 448 C346 428 366 396 432 382'}];
const T0=420,T1=1200,pad=(n)=>String(n).padStart(2,'0');
const hm=v=>pad(Math.floor(v/60))+':'+pad(v%60);
let foc=null;
const panel=document.getElementById('panel'),gantt=document.getElementById('gantt'),routes=document.getElementById('routes'),labels=document.getElementById('labels');

D.forEach(s=>{
  const c=document.createElement('div');c.className='card';c.dataset.id=s.id;
  c.innerHTML='<div><span class="code">'+s.lab+'</span><span class="nm">'+s.nm+'</span></div><div class="w">'+hm(s.o)+'–'+hm(s.e)+'</div><div class="rd">'+s.rd+'</div>';
  panel.appendChild(c);

  const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',s.d);p.dataset.id=s.id;routes.appendChild(p);

  const r=document.createElement('div');r.className='grow';r.dataset.id=s.id;
  r.innerHTML='<div class="glab">'+s.lab+'</div><div class="gtrack"><div class="gbar" style="left:'+((s.o-T0)/(T1-T0)*100)+'%;width:'+((s.e-s.o)/(T1-T0)*100)+'%"></div></div>';
  gantt.appendChild(r);
});
const now=document.createElement('div');now.className='now';gantt.appendChild(now);

function state(s,t){return t<s.o?'pending':t>s.e?'reopened':'closed'}

function render(){
  const t=+document.getElementById('t').value;
  document.getElementById('tout').textContent=hm(t);
  const trackLeft=70,trackW=gantt.clientWidth-70;
  now.style.left=(trackLeft+trackW*(t-T0)/(T1-T0))+'px';
  labels.innerHTML='';
  D.forEach(s=>{
    const st=state(s,t),f=foc===s.id,dim=foc&&!f;
    const col=st==='closed'?'var(--state-closed)':st==='reopened'?'var(--state-reopened)':'var(--state-pending)';
    const p=routes.querySelector('[data-id="'+s.id+'"]');
    p.setAttribute('stroke',col);
    p.setAttribute('stroke-width',f?6:st==='closed'?4:st==='reopened'?2:3);
    p.setAttribute('opacity',dim?0.2:f?1:0.85);
    if(f){
      const L=p.getTotalLength(),m=p.getPointAtLength(L/2);
      const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
      tx.setAttribute('x',m.x);tx.setAttribute('y',m.y-12);tx.setAttribute('text-anchor','middle');
      tx.setAttribute('fill','#eef0f4');tx.setAttribute('font-size','13');tx.setAttribute('font-family','var(--mono)');
      tx.textContent=s.lab;labels.appendChild(tx);
    }
    const c=panel.querySelector('[data-id="'+s.id+'"]');
    c.className='card '+st+(f?' focused':'')+(dim?' dimmed':'');
    const g=gantt.querySelector('[data-id="'+s.id+'"]');
    g.querySelector('.gbar').className='gbar '+st;
    g.style.opacity=dim?0.25:1;
  });
}
function set(v){foc=v;render()}
document.querySelectorAll('#panel .card,#gantt .grow').forEach(el=>{
  el.addEventListener('mouseenter',()=>set(el.dataset.id));
  el.addEventListener('mouseleave',()=>set(null));
});
document.getElementById('t').addEventListener('input',render);
addEventListener('resize',render);
render();
</script>
</body>
</html>
