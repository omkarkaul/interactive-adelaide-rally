<!-- A stage line: the one shape this project is about. The two colours are the
     literal values of the bg-base and accent tokens in src/tokens.css. public/ is
     outside the build's CSS so var() is unavailable here, and these must be moved
     by hand if the palette moves. Accent is chrome, which a favicon is; a red mark
     would read as closure state. (No double hyphens above: XML forbids them in
     comments, and an SVG that breaks that rule silently fails to render.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#12141a"/>
  <path d="M9 26v-7a6 6 0 0 1 6-6h2a6 6 0 0 0 6-6V6"
        fill="none" stroke="#f2733d" stroke-width="4.5" stroke-linecap="round"/>
</svg>
